# Extension field: every API runs the same way, only from a different folder.
# The whole repo is mounted so each API can still reach ../adapter for its types
# and ../build/swagger.json for the combined spec.
x-api: &api
  image: node:20
  volumes:
    - ./:/app
  command: npx -y tsx ./index.ts
  depends_on:
    - mongo

services:
  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-end
      - books
      - warehouse
      - orders
      - docs

  front-end:
    image: ghcr.io/mcmastercce/bvd-103-mcmasterful-books/mcmasterful-books-docker:main
    volumes:
      - ./adapter:/source/adapter

  # The book catalogue.
  books:
    <<: *api
    working_dir: /app/books

  # Shelf stock and order fulfilment.
  warehouse:
    <<: *api
    working_dir: /app/warehouse

  # Placing and listing orders.
  orders:
    <<: *api
    working_dir: /app/orders

  # The Swagger UI for every API, from the combined build/swagger.json.
  # It has no database; the shared mongo dependency is harmless.
  docs:
    <<: *api
    working_dir: /app/docs

  mongo:
    image: mongo:latest
