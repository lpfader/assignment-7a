# Extension field: every Node service runs the same way, only from a different folder.
# The whole repo is mounted so each one can still reach ../adapter for its types
# and ../build/swagger.json for the combined spec.
x-node: &node
  image: node:20
  volumes:
    - ./:/app
  command: npx -y tsx ./index.ts

# Each API has its own database server (MONGO_URL) that no other service connects
# to, and waits for it and for RabbitMQ's health check: RabbitMQ takes 10-20 seconds
# to boot, and connecting before then fails.

services:
  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-end
      - books
      - warehouse
      - orders
      - docs

  front-end:
    image: ghcr.io/mcmastercce/bvd-103-mcmasterful-books/mcmasterful-books-docker:main
    volumes:
      - ./adapter:/source/adapter

  # The book catalogue, and its copy of each book's total stock.
  books:
    <<: *node
    working_dir: /app/books
    environment:
      MONGO_URL: mongodb://mongo
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Shelf stock and order fulfilment, and its copies of book names and open orders.
  warehouse:
    <<: *node
    working_dir: /app/warehouse
    environment:
      MONGO_URL: mongodb://warehouse-db
    depends_on:
      warehouse-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Placing and listing orders, and its copy of the valid book ids.
  orders:
    <<: *node
    working_dir: /app/orders
    environment:
      MONGO_URL: mongodb://orders-db
    depends_on:
      orders-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # The Swagger UI for every API, from the combined build/swagger.json.
  # No database and no messaging, so it doesn't wait for either.
  docs:
    <<: *node
    working_dir: /app/docs

  # One database server per API. mongo is books' (it kept its name so the existing
  # catalogue stays). The data lives in each container, so `docker compose down`
  # deletes it; `stop` keeps it.
  mongo:
    image: mongo:latest

  warehouse-db:
    image: mongo:latest

  orders-db:
    image: mongo:latest

  # The message broker the APIs use to send each other events. The management
  # image adds a dashboard: http://localhost:15672, user guest, password guest.
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - '15672:15672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 20
