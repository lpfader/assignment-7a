# Two caches: one for the storefront, one for the API responses worth reusing.
proxy_cache_path /var/cache/nginx/site levels=1:2 keys_zone=site_cache:10m max_size=200m inactive=30m use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

# One upstream per API. Each has a single server for now; adding another copy of
# an API is one more `server` line, and nginx goes back to round robin between them.
# The zone keeps that rotation shared between nginx's worker processes.
upstream books_api {
    zone books_zone 64k;
    server books:3000;
}

upstream warehouse_api {
    zone warehouse_zone 64k;
    server warehouse:3000;
}

upstream orders_api {
    zone orders_zone 64k;
    server orders:3000;
}

server {
    listen 80;

    # Makes cache and load balancing visible while testing.
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Upstream $upstream_addr always;

    # Book details: a GET that only changes when the book itself changes.
    # Quoted, because unquoted {24} would be parsed as a config block.
    location ~ "^/api/books/([0-9a-fA-F]{24})$" {
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_pass http://books_api/books/$1;
    }

    # Unfiltered book list. The adapter posts here, sending X-Book-Filters only
    # when filters are applied; those requests bypass the cache and are never
    # stored in it.
    location = /api/books/list {
        proxy_cache api_cache;
        proxy_cache_key "unfiltered-book-list";
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_lock on;
        proxy_cache_bypass $http_x_book_filters;
        proxy_no_cache $http_x_book_filters;
        proxy_pass http://books_api/books/list;
    }

    # Warehouse: shelf stock and fulfilment. Dynamic, so no caching.
    location /api/warehouse/ {
        proxy_pass http://warehouse_api/warehouse/;
    }

    location /api/fulfil/ {
        proxy_pass http://warehouse_api/fulfil/;
    }

    # Orders: POST /api/order and GET /api/order. Dynamic, so no caching.
    location /api/order {
        proxy_pass http://orders_api/order;
    }

    # Everything else under /api (books and the Swagger docs) is the books API.
    # Dynamic, so no caching.
    location /api/ {
        proxy_pass http://books_api/;
    }

    # The storefront is static but its dev server sends no-cache, so ignore
    # those headers and cache it here instead.
    location / {
        proxy_cache site_cache;
        proxy_cache_valid 200 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_pass http://front-end:9080/;
    }
}
